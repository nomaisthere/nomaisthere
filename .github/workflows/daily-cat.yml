name: 🐱 Daily Cat

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  update-cat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch a random cat
        id: cat
        run: |
          RESPONSE=$(curl -s "https://api.thecatapi.com/v1/images/search")
          URL=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['url'])")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          CAT_URL="${{ steps.cat.outputs.url }}"
          TODAY=$(date +"%B %d, %Y")

          python3 - "$CAT_URL" "$TODAY" <<EOF
          import re, sys

          cat_url = sys.argv[1]
          today = sys.argv[2]

          with open("README.md", "r") as f:
              content = f.read()

          new_block = "<!-- CAT_START -->\n>Cat of the day - " + today + " (come back tomorrow for another one): \n\n![](" + cat_url + ")\n<!-- CAT_END -->"

          updated = re.sub(
              r"<!-- CAT_START -->.*?<!-- CAT_END -->",
              new_block,
              content,
              flags=re.DOTALL
          )
          with open("README.md", "w") as f:
              f.write(updated)
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🐱 daily cat drop $(date +%Y-%m-%d)" || echo "No changes"
          git push
