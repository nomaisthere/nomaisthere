name: 🎵 Last.fm Now Playing

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-music:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch last played track
        run: |
          python3 - "${{ secrets.LASTFM_API_KEY }}" <<'EOF'
          import sys, urllib.request, json

          api_key = sys.argv[1]
          user = "yourenoughnoam"

          url = f"https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user={user}&api_key={api_key}&format=json&limit=1"
          data = json.loads(urllib.request.urlopen(url).read())
          track = data["recenttracks"]["track"][0]

          name = track["name"]
          artist = track["artist"]["#text"]
          url = track["url"]
          nowplaying = track.get("@attr", {}).get("nowplaying") == "true"

          label = "now playing" if nowplaying else "last played"
          line = f"{label}: [{name} — {artist}]({url})"

          with open("README.md", "r") as f:
              content = f.read()

          import re
          new_block = f"<!-- LASTFM_START -->\n{line}\n<!-- LASTFM_END -->"
          updated = re.sub(
              r"<!-- LASTFM_START -->.*?<!-- LASTFM_END -->",
              new_block,
              content,
              flags=re.DOTALL
          )
          with open("README.md", "w") as f:
              f.write(updated)
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🎵 music update $(date +%Y-%m-%d\ %H:%M)" || echo "No changes"
          git push
